<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Manipulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="container">
    <h1>Dynamic Style Control Panel</h1>
    <p id="sampleText">This is a sample paragraph of text that you can manipulate using the buttons below. Click the buttons to change its appearance.</p>
    <button id="bgColorBtn">Change Background Color</button>
    <button id="fontSizeBtn">Increase Font Size</button>
    <button id="centerBtn">Center Text</button>
    <button id="resetBtn">Reset Style</button>
    <script src="script.js"></script>
</body>
</html>
